syntax = "proto3";

option go_package = "github.com/sonlam137216/read-excel";

service ExampleService {
  rpc SayHello (HelloRequest) returns (HelloResponse) {}
}
  
message HelloRequest {
  string name = 1;
}

message HelloResponse {
  repeated Row rows = 1;
}

message Row {
  repeated Cell cells = 1;
}

message Cell {
   string column = 1;
   int32 row = 2;
   string value = 3;
}